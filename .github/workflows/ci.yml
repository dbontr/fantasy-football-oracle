name: Verify championship architecture

"on":
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: oracle-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y g++

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Verify source, native engine, tests, and artifacts
        run: npm run verify:offline

      - name: Audit production dependencies
        run: npm audit --audit-level=high

      - name: Create a recovery package
        run: node scripts/backup-oracle.js --out "$RUNNER_TEMP/oracle-recovery"

      - name: Verify and restore the recovery package
        shell: bash
        run: |
          PACKAGE="$(find "$RUNNER_TEMP/oracle-recovery" -mindepth 1 -maxdepth 1 -type d -name 'oracle-*' | head -n 1)"
          test -n "$PACKAGE"
          node scripts/verify-backup.js --package "$PACKAGE"
          node scripts/disaster-recovery-drill.js --package "$PACKAGE" --skip-install

      - name: Upload integrity evidence
        uses: actions/upload-artifact@v7
        with:
          name: oracle-integrity-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            data/artifact-manifest.json
            MANIFEST.sha256
            artifacts/sbom.cdx.json

  verify-windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out complete history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Locate or install a C++20 compiler
        shell: pwsh
        run: |
          $compiler = @(
            "C:\msys64\ucrt64\bin\g++.exe"
            "C:\msys64\mingw64\bin\g++.exe"
            (Get-Command g++.exe -ErrorAction SilentlyContinue).Source
          ) | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          if (-not $compiler) {
            choco install mingw --no-progress -y
            $compiler = (Get-Command g++.exe -ErrorAction Stop).Source
          }
          "CXX=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $compiler --version
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Validate Windows service manager
        shell: pwsh
        run: |
          [scriptblock]::Create(
            (Get-Content scripts/windows/oracle-service.ps1 -Raw)
          ) | Out-Null
          [scriptblock]::Create(
            (Get-Content scripts/windows/test-oracle-service.ps1 -Raw)
          ) | Out-Null
      - name: Verify Windows source, native engine, tests, and artifacts
        run: npm run verify:offline
      - name: Exercise Windows service lifecycle
        shell: pwsh
        run: npm run service:windows:test -- -RuntimeDir "$env:RUNNER_TEMP\oracle-service-runtime" -Port 18787
      - name: Audit production dependencies
        run: npm audit --audit-level=high
      - name: Verify Windows recovery package
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "oracle-recovery"
          node scripts/backup-oracle.js --out $out
          $package = Get-ChildItem $out -Directory -Filter "oracle-*" |
            Select-Object -First 1
          if (-not $package) {
            throw "Recovery package was not created."
          }
          node scripts/verify-backup.js --package $package.FullName
          node scripts/disaster-recovery-drill.js --package $package.FullName --skip-install

  verify-container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build production image
        run: docker build --pull --tag oracle-ci:${{ github.sha }} .

      - name: Start hardened production container
        shell: bash
        run: |
          set -euo pipefail
          docker volume create oracle-ci-runtime
          docker run --detach \
            --name oracle-ci \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --mount source=oracle-ci-runtime,target=/app/data/runtime \
            --publish 127.0.0.1:8787:8787 \
            oracle-ci:${{ github.sha }}

      - name: Wait for readiness and run strict smoke
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            HEALTH="$(docker inspect --format '{{.State.Health.Status}}' oracle-ci)"
            if [ "$HEALTH" = "healthy" ]; then
              break
            fi
            if [ "$HEALTH" = "unhealthy" ]; then
              docker logs oracle-ci
              exit 1
            fi
            sleep 2
          done
          test "$(docker inspect --format '{{.State.Health.Status}}' oracle-ci)" = "healthy"
          node scripts/smoke-production.js --base http://127.0.0.1:8787 --strict
          test "$(docker inspect --format '{{.Config.User}}' oracle-ci)" = "node"
          test "$(docker exec oracle-ci id -u)" != "0"
          docker exec oracle-ci test ! -e /app/tests
          docker exec oracle-ci test ! -e /app/docs
          docker exec oracle-ci test ! -e /app/native/src
          docker exec oracle-ci test ! -e /app/native/build.js

      - name: Show container logs on failure
        if: failure()
        run: docker logs oracle-ci || true

      - name: Remove test container
        if: always()
        run: |
          docker rm -f oracle-ci || true
          docker volume rm oracle-ci-runtime || true
